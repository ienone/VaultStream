name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend pytest and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check backend requirement coverage
        run: python ../scripts/check_backend_requirements.py

      - name: Run pytest
        run: python -m pytest tests -q -m "not integration"

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run Bandit high severity scan
        run: python -m bandit -r app --severity-level high --confidence-level high

      - name: Check OpenAPI docs inventory
        run: python ../scripts/check_openapi_docs.py ../docs/backend/api/endpoints.md

      - name: Check SQLite schema gate
        run: python ../scripts/check_database_schema.py

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
