name: Quality Gates

on:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend static checks and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check backend requirement coverage
        if: always()
        run: python ../scripts/check_backend_requirements.py

      - name: Audit Python dependencies
        if: always()
        run: python -m pip_audit -r requirements.txt

      - name: Run Bandit high severity scan
        if: always()
        run: python -m bandit -r app --severity-level high --confidence-level high

      - name: Check OpenAPI docs inventory
        if: always()
        run: python ../scripts/check_openapi_docs.py ../docs/backend/api/endpoints.md

      - name: Check SQLite schema gate
        if: always()
        run: python ../scripts/check_database_schema.py

  frontend:
    name: Frontend analyze and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          dart run tool/dependencies/ensure_inactive_branch_back_navigation.dart

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Build Web
        run: flutter build web --release --no-pub
