name: Multi-Platform Build

on:
  workflow_dispatch:

jobs:
  client-secret-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject API token in client builds
        run: |
          pattern='--dart-define=API''_TOKEN'
          if grep -R -- "$pattern" .github/workflows; then
            echo "API_TOKEN must not be embedded into distributed Flutter artifacts"
            exit 1
          fi

  # Android Build
  android:
    needs: client-secret-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: frontend

      - name: Build Debug APK
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://localhost:8000' }} \
            --dart-define=DEBUG_LOG=false
        working-directory: frontend
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://localhost:8000' }} \
            --dart-define=DEBUG_LOG=false
        working-directory: frontend
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vaultstream-android-debug
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vaultstream-android-release
          path: frontend/build/app/outputs/flutter-apk/app-release.apk

  # Web Build
  web:
    needs: client-secret-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: frontend

      - name: Build Web
        run: |
          flutter build web --release \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://localhost:8000' }} \
            --dart-define=DEBUG_LOG=false
        working-directory: frontend

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: vaultstream-web
          path: frontend/build/web

  # Linux Build
  linux:
    needs: client-secret-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: frontend

      - name: Build Linux
        run: flutter build linux --release --dart-define=DEBUG_LOG=false
        working-directory: frontend

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: vaultstream-linux
          path: frontend/build/linux/x64/release/bundle
