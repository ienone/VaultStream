name: Multi-Platform Build

on:
  workflow_dispatch:
    inputs:
      build_debug:
        description: "额外构建 Android Debug APK"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  client-secret-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject API token in client builds
        run: |
          pattern='--dart-define=API''_TOKEN'
          if grep -R -- "$pattern" .github/workflows; then
            echo "API_TOKEN must not be embedded into distributed Flutter artifacts"
            exit 1
          fi

  # Android Build
  android:
    needs: client-secret-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          flutter pub get
          dart run tool/dependencies/ensure_inactive_branch_back_navigation.dart
        working-directory: frontend

      - name: Cache generated Dart code
        uses: actions/cache@v4
        with:
          path: |
            frontend/.dart_tool/build
            frontend/lib/**/*.g.dart
            frontend/lib/**/*.freezed.dart
          key: dart-codegen-v1-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-${{ hashFiles('frontend/pubspec.*', 'frontend/build.yaml', 'frontend/lib/**/*.dart', '!frontend/lib/**/*.g.dart', '!frontend/lib/**/*.freezed.dart', 'frontend/tool/**') }}

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: frontend

      - name: Build Debug APK
        if: inputs.build_debug
        run: |
          flutter build apk --debug --no-pub \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://localhost:8000' }} \
            --dart-define=DEBUG_LOG=false
        working-directory: frontend
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

      - name: Build Release APK
        run: |
          flutter build apk --release --split-per-abi --no-pub \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://localhost:8000' }} \
            --dart-define=DEBUG_LOG=false
        working-directory: frontend
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

      - name: Upload Debug APK
        if: inputs.build_debug
        uses: actions/upload-artifact@v7
        with:
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          archive: false
          if-no-files-found: error

      - name: Upload ARM64 Release APK
        uses: actions/upload-artifact@v7
        with:
          path: frontend/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          archive: false
          if-no-files-found: error

      - name: Upload ARM32 Release APK
        uses: actions/upload-artifact@v7
        with:
          path: frontend/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          archive: false
          if-no-files-found: error

      - name: Upload x86_64 Release APK
        uses: actions/upload-artifact@v7
        with:
          path: frontend/build/app/outputs/flutter-apk/app-x86_64-release.apk
          archive: false
          if-no-files-found: error

  # Web Build
  web:
    needs: client-secret-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          dart run tool/dependencies/ensure_inactive_branch_back_navigation.dart
        working-directory: frontend

      - name: Cache generated Dart code
        uses: actions/cache@v4
        with:
          path: |
            frontend/.dart_tool/build
            frontend/lib/**/*.g.dart
            frontend/lib/**/*.freezed.dart
          key: dart-codegen-v1-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-${{ hashFiles('frontend/pubspec.*', 'frontend/build.yaml', 'frontend/lib/**/*.dart', '!frontend/lib/**/*.g.dart', '!frontend/lib/**/*.freezed.dart', 'frontend/tool/**') }}

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: frontend

      - name: Build Web
        run: |
          flutter build web --release --no-pub \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://localhost:8000' }} \
            --dart-define=DEBUG_LOG=false
        working-directory: frontend

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: vaultstream-web
          path: frontend/build/web

  # Linux Build
  linux:
    needs: client-secret-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - name: Set up Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          dart run tool/dependencies/ensure_inactive_branch_back_navigation.dart
        working-directory: frontend

      - name: Cache generated Dart code
        uses: actions/cache@v4
        with:
          path: |
            frontend/.dart_tool/build
            frontend/lib/**/*.g.dart
            frontend/lib/**/*.freezed.dart
          key: dart-codegen-v1-${{ runner.os }}-${{ steps.flutter.outputs.VERSION }}-${{ hashFiles('frontend/pubspec.*', 'frontend/build.yaml', 'frontend/lib/**/*.dart', '!frontend/lib/**/*.g.dart', '!frontend/lib/**/*.freezed.dart', 'frontend/tool/**') }}

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: frontend

      - name: Build Linux
        run: flutter build linux --release --no-pub --dart-define=DEBUG_LOG=false
        working-directory: frontend

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: vaultstream-linux
          path: frontend/build/linux/x64/release/bundle
