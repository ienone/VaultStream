name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write  # 创建 Release 并上传文件

jobs:
  quality-gates:
    name: Release Quality Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend audit dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Audit Python dependencies
        working-directory: backend
        run: python -m pip_audit -r requirements.txt

      - name: Run Bandit high severity scan
        working-directory: backend
        run: python -m bandit -r app --severity-level high --confidence-level high

      - name: Check OpenAPI docs inventory
        run: python scripts/check_openapi_docs.py

      - name: Check SQLite schema gate
        run: python scripts/check_database_schema.py

      - name: Check release debug flag
        shell: bash
        run: |
          if grep -R "DEBUG_LOG=true" -n .github frontend; then
            echo "DEBUG_LOG=true must not be used in release automation"
            exit 1
          fi
          grep -R -- "--dart-define=DEBUG_LOG=false" .github/workflows/release.yml

      - name: Build backend image for scan
        run: docker build -t vaultstream-api:scan ./backend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vaultstream-api:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate backend image SBOM
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vaultstream-api:scan
          format: cyclonedx
          output: vaultstream-api.sbom.cdx.json
          exit-code: "0"

      - name: Upload backend image SBOM
        uses: actions/upload-artifact@v4
        with:
          name: vaultstream-api-sbom
          path: vaultstream-api.sbom.cdx.json

  # ────────────────────────────────────────────
  # 1. Android APK
  # ────────────────────────────────────────────
  apk:
    name: Build APK
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/*.gradle*') }}

      - name: Install deps & codegen
        working-directory: frontend
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > frontend/android/app/release.jks
          fi

      - name: Build Release APK
        working-directory: frontend
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --dart-define=DEBUG_LOG=false

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/build/app/outputs/flutter-apk/app-*-release.apk

  docker-backend:
    name: Build & Push Backend Image
    needs: quality-gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vaultstream-api
          cache-to: type=gha,mode=max,scope=vaultstream-api

  docker-frontend:
    name: Build & Push Frontend Image
    needs: quality-gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install deps & codegen
        working-directory: frontend
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Flutter Web
        working-directory: frontend
        run: flutter build web --release --dart-define=DEBUG_LOG=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vaultstream-web
          cache-to: type=gha,mode=max,scope=vaultstream-web
