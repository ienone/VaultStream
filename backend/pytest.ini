[pytest]
pythonpath = . ..
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
markers =
    integration: tests requiring network/external services
filterwarnings =
    error::ResourceWarning
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore:RequestsDependencyWarning
# 仅运行少量长期回归；临时验收不进入默认套件。
addopts = 
    -m "not integration"
    --disable-socket
    --allow-hosts=127.0.0.1,::1
    --allow-unix-socket
    -p no:xdist
